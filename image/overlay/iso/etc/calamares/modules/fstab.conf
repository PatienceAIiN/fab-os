---
# Fab OS installer: fstab module (writes /etc/fstab, /etc/crypttab and the swap file in the target). In Calamares 3.3 the
# per-filesystem mount options moved to mount.conf (mountOptions -> global storage "mountOptionsList"); this file only
# keeps the crypttab options and the /tmp policy (schema: fstab.schema.yaml, tmpOptions is required).
# With an unencrypted /boot the module writes the root mapping with key "none" and no options, so the initramfs asks for
# the passphrase (fstab/main.py, generate_crypttab_line_info).
crypttabOptions: luks
tmpOptions:
    default:
        tmpfs: false
        options: ""
    ssd:
        tmpfs: true
        options: "defaults,noatime,mode=1777"
