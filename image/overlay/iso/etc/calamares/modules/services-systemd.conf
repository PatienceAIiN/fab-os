---
# Fab OS installer: services-systemd module - `systemctl <action> <unit>` in the target chroot (symlinks only, offline).
# FORMAT (Calamares 3.3, services-systemd.schema.yaml + main.py): `units` is ONE flat list of {name, action, mandatory}.
# The older nested form (units: {enable: [...], disable: [...]}) is not understood by 3.3 - iterating the map yields the
# words "enable"/"disable" as unit names, so nothing was enabled or disabled on the owner's device.
# Every unit named here exists in the image (tests/calamares-jobs-test.sh checks each one with `systemctl cat` and replays
# the action). Only NetworkManager and sddm are mandatory (missing = broken image); the rest never fail the install.
units:
  - name: NetworkManager
    action: enable
    mandatory: true
  - name: sddm
    action: enable
    mandatory: true
  - name: fabos-firstboot
    action: enable
    mandatory: false
  - name: fabos-feedback.socket
    action: enable
    mandatory: false
  - name: fabos-update-check.timer
    action: enable
    mandatory: false
  - name: unattended-upgrades
    action: enable
    mandatory: false
  - name: ufw
    action: enable
    mandatory: false
  # live medium / QEMU harness only
  - name: casper
    action: disable
    mandatory: false
  - name: serial-getty@ttyS0
    action: disable
    mandatory: false
  - name: fabos-live-selftest
    action: disable
    mandatory: false
