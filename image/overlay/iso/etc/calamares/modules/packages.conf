---
# Post-install package clean-up in the installed system (runs in the target chroot, offline).
# Only packages that are REALLY installed in the live image may be listed under `remove`: apt fails hard on an unknown
# name when no package lists are present (the live image drops them), and Calamares then reports "Package Manager error"
# and the whole installation as failed (this happened on real hardware with the old calamares-settings-ubuntu-common entry).
# `try_remove` never fails the job. Verified against the image: casper and calamares are installed; nothing else is live-only.
# The apt backend (packages/main.py PMApt.remove) runs `apt-get --purge -q -y autoremove` right after the removal, which
# also takes the packages only these two pulled in (calamares-data, libcalamares*, libyaml-cpp, libboost-python,
# squashfs-tools, finalrd, user-setup, localechooser-data, lzma - all apt-mark auto). tests/calamares-jobs-test.sh replays
# both steps offline and checks that nothing the installed system needs (cryptsetup, GRUB/shim, efibootmgr, plymouth, sddm,
# NetworkManager, fabos-*) is among them.
backend: apt
skip_if_no_internet: false
update_db: false
operations:
  - try_remove:
      - casper
      - calamares
