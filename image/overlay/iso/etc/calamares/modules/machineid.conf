---
# Fab OS installer: machineid module. Ubuntu's calamares package installs no default module configs, and a job module
# without a config runs with every option off (this one would then leave the target without a machine-id).
# Keys from src/modules/machineid/MachineIdJob.cpp (3.3.14).
systemd: true
systemd-style: uuid
dbus: true
dbus-symlink: true
entropy-copy: false
entropy-files: []
