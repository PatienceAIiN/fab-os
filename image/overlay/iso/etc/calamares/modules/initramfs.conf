---
# Fab OS installer: initramfs module - runs `update-initramfs -k all -c -t` in the target (offline; initramfs-tools).
# Keys verified against src/modules/initramfs/InitramfsJob.cpp (3.3.14): "kernel" and "be_unsafe" only
# (the earlier "initramfsName" key belongs to the dracut module and was ignored).
kernel: all
# Keep the initramfs unreadable for other users (writes /etc/initramfs-tools/conf.d/calamares-safe-initramfs.conf, UMASK=0077).
be_unsafe: false
