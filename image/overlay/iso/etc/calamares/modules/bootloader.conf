---
# Fab OS installer: bootloader module - GRUB on UEFI, installed by Ubuntu's grub-install, which places the Secure-Boot-signed
# shim + GRUB (shim-signed, grub-efi-amd64-signed) on the EFI system partition and registers the firmware boot entry.
#
# efiBootloaderId MUST stay "ubuntu": Ubuntu's signed grubx64.efi carries the fixed prefix /EFI/ubuntu (the string is in
# the binary, there is no $cmdpath logic), so it only finds its grub.cfg in EFI/ubuntu/. With the id "fabos" the installed
# GRUB could not find its configuration. The menu entry itself is still titled "Fab OS" (GRUB_DISTRIBUTOR, from the
# branding) - see ADR-0021.
efiBootLoader: "grub"
# (no kernel/img/fallback/timeout keys: they belong to the systemd-boot/refind paths and are not in bootloader.schema.yaml)
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "ubuntu"
# Also copy GRUB to EFI/boot/bootx64.efi for firmware that ignores NVRAM entries; shellprocess@efifallback then replaces
# that copy with shim (Secure Boot friendly) and puts grubx64.efi next to it.
installEFIFallback: true
