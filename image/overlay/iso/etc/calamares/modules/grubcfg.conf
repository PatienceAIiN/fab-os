---
# Fab OS installer: grubcfg module (edits /etc/default/grub in the target). Key names verified against
# src/modules/grubcfg/main.py and grubcfg.schema.yaml of Calamares 3.3.14 (snake_case: keep_distributor, kernel_params,
# always_use_defaults - the earlier camelCase "keepDistributor" was silently ignored).
# The file shipped in the image is kept (overwrite: false) and updated in place: GRUB_CMDLINE_LINUX_DEFAULT (quiet splash
# + the LUKS/resume parameters the module computes), GRUB_DISTRIBUTOR from the branding's bootloaderEntryName ("Fab OS")
# and the defaults below (always_use_defaults: true - without it the defaults block is only used when the file is absent).
overwrite: false
prefer_grub_d: false
keep_distributor: false
always_use_defaults: true
kernel_params: [ "quiet" ]
defaults:
  GRUB_TIMEOUT: 3
  GRUB_TIMEOUT_STYLE: "hidden"
  GRUB_DEFAULT: "0"
  GRUB_DISABLE_SUBMENU: true
  GRUB_DISABLE_RECOVERY: false
