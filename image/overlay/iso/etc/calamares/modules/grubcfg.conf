---
# Fab OS installer: grubcfg module (edits /etc/default/grub in the target). Key names verified against
# src/modules/grubcfg/main.py and grubcfg.schema.yaml of Calamares 3.3.14 (snake_case: keep_distributor, kernel_params,
# always_use_defaults - the earlier camelCase "keepDistributor" was silently ignored).
# The file shipped in the image is kept (overwrite: false) and updated in place: GRUB_CMDLINE_LINUX_DEFAULT (quiet splash
# + the cryptdevice=/root= parameters the module computes for a LUKS root), GRUB_DISTRIBUTOR from the branding's
# bootloaderEntryName ("Fab OS") and the defaults below (always_use_defaults: true - without it the defaults block is only
# used when the file is absent).
# NOTE what is authoritative: grub-mkconfig sources /etc/default/grub and THEN /etc/default/grub.d/*.cfg, and fabos-branding
# ships /etc/default/grub.d/fabos.cfg (GRUB_DISTRIBUTOR "Fab OS", GRUB_CMDLINE_LINUX_DEFAULT "quiet splash",
# GRUB_TIMEOUT_STYLE hidden, GRUB_TIMEOUT 2). For those four keys the snippet wins over anything written here; the values
# below are kept identical so the two files never contradict each other (tests/calamares-jobs-test.sh checks the effective
# result). Dropping the module's cryptdevice=/root= is harmless: they are mkinitcpio parameters, initramfs-tools unlocks the
# root from /etc/crypttab; and no resume= is ever computed because swap is a file (partition.conf: initialSwapChoice file).
overwrite: false
prefer_grub_d: false
keep_distributor: false
always_use_defaults: true
kernel_params: [ "quiet" ]
defaults:
  GRUB_TIMEOUT: 2
  GRUB_TIMEOUT_STYLE: "hidden"
  GRUB_DEFAULT: "0"
  GRUB_DISABLE_SUBMENU: true
  GRUB_DISABLE_RECOVERY: false
