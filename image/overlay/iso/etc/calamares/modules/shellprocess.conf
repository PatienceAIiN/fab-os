dontChroot: false
timeout: 60
script:
  - "rm -f /etc/skel/Desktop/fabos-install.desktop /home/*/Desktop/fabos-install.desktop /etc/casper.conf /etc/sddm.conf.d/20-autologin-live.conf /etc/sudoers.d/fabos-live"
  - "userdel -r fabos || true"
  - "rm -f /var/lib/fabos/firstboot-done"
  - "systemctl enable fabos-firstboot.service fabos-update-check.timer fabos-feedback.socket || true"
