---
# Fab OS installer: post-copy clean-up in the target (chroot), in one shipped script. Calamares expands $name / ${name}
# inside every command line here (KMacroExpander, for ROOT and USER) and aborts the installation with "Missing variables"
# if a shell variable appears - so the shell lives in /usr/lib/fabos/install-finish.sh and this line must contain no '$'.
# The script is guarded (always exits 0), logs into the Calamares session log and needs no network.
# tests/calamares-jobs-test.sh replays it offline inside the image and rejects any '$' in these lines.
dontChroot: false
timeout: 120
script:
  - '/usr/lib/fabos/install-finish.sh'
