---
# Fab OS installer: post-copy clean-up in the target (chroot). Every line runs through `/bin/sh -c` and is guarded so it
# cannot fail the installation on its own; each one logs what it did into the Calamares session log. Nothing here needs
# the network. tests/calamares-jobs-test.sh replays every line offline inside the image.
dontChroot: false
timeout: 120
script:
  # live-session artefacts (casper, the passwordless live user's sudo rule and autologin, the desktop installer icon)
  - 'rm -f /etc/skel/Desktop/fabos-install.desktop /etc/casper.conf /etc/sddm.conf.d/20-autologin-live.conf /etc/sudoers.d/fabos-live; rm -f /home/*/Desktop/fabos-install.desktop; echo "fabos: live-session files removed"; true'
  # the live user (never present on the installed system; the users module has already created the real account)
  - 'if id fabos >/dev/null 2>&1; then if userdel -r fabos 2>/tmp/userdel.err; then echo "fabos: live user removed"; else echo "fabos: userdel exit $? - $(cat /tmp/userdel.err)"; fi; rm -f /tmp/userdel.err; else echo "fabos: no live user in target"; fi; true'
  # units that only make sense on the live medium / in the QEMU harness
  - 'systemctl disable serial-getty@ttyS0.service fabos-live-selftest.service >/dev/null 2>&1; rm -f /var/lib/fabos/firstboot-done; echo "fabos: live-only units disabled, first-boot marker cleared"; true'
  # first boot, update check, feedback relay, automatic security updates (all shipped in the image; enable = symlinks only)
  - 'if systemctl enable fabos-firstboot.service fabos-update-check.timer fabos-feedback.socket unattended-upgrades.service >/dev/null 2>&1; then echo "fabos: units enabled"; else echo "fabos: systemctl enable exit $? (services-systemd already enabled them)"; fi; true'
  # evidence in the log: the Fab OS apt source + keyring and the --global user units survived the copy
  - 'for f in /etc/apt/sources.list.d/fabos.sources /usr/share/keyrings/fabos-archive-keyring.gpg /etc/apt/apt.conf.d/52fabos-unattended /etc/systemd/user/default.target.wants/fabos-agent.service /etc/systemd/user/default.target.wants/fabos-voiced.service /etc/systemd/user/sockets.target.wants/fabos-llama.socket; do if [ -e "$f" ]; then echo "fabos: ok $f"; else echo "fabos: MISSING $f"; fi; done; true'
  # install stamp for support ("when was this system installed")
  - 'mkdir -p /etc/fabos && date -u +%Y-%m-%dT%H:%M:%SZ > /etc/fabos/installed-at && echo "fabos: stamp written"; true'
