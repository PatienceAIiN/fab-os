---
# Fab OS installer: welcome page requirements. Values in GiB. The RAM minimum matches the README (2 GB machines are
# supported; Calamares compares against 95 % of the physical RAM, and a "2 GB" machine reports about 1.9 GiB), so a
# 2 GB device is never refused. The internet check is informative only (not in `required`): the whole installation
# runs offline from the squashfs, and the URL is the Fab OS apt archive that unattended-upgrades will use later.
showSupportUrl: true
showKnownIssuesUrl: false
showReleaseNotesUrl: false
requirements:
  requiredStorage: 15
  requiredRam: 1.5
  internetCheckUrl: https://fabos.patienceai.in/apt/
  check: [ storage, ram, power, internet, root ]
  required: [ storage, ram, root ]
