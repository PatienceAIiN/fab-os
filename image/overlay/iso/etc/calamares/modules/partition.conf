---
# Fab OS installer: partition module (Calamares 3.3.14; keys verified against src/modules/partition/Config.cpp).
#
# Layout for the automated choices (Erase disk / Replace / Alongside):
#   EFI system partition 512 MiB (FABOS-ESP)  +  /boot 2 GiB ext4, NEVER encrypted  +  / (rest, user's filesystem choice)
#   +  a 512 MiB swap file (fstab module) unless the user picks a swap partition.
# The separate, unencrypted /boot is deliberate (ADR-0021): Ubuntu's Secure-Boot-signed GRUB image does not contain the
# argon2 module, so it cannot open a LUKS2 volume made with cryptsetup's default PBKDF (argon2id); keeping the kernel and
# initramfs outside the LUKS container means GRUB never has to. The initramfs (cryptsetup-initramfs) asks for the
# passphrase once per boot, through the Fab OS Plymouth theme. Calamares itself then skips the /boot keyfile
# (luksbootkeyfile: "/boot partition is not encrypted, skipping keyfile creation"), uses the encrypt_hook_nokey
# initramfs hook and leaves GRUB_ENABLE_CRYPTODISK unset - all read from the 3.3.14 sources.
efi:
    mountPoint:      "/boot/efi"
    recommendedSize: 512MiB
    minimumSize:     300MiB
    label:           "FABOS-ESP"
userSwapChoices: [ none, small, file ]
initialSwapChoice: file
# "Erase disk" is preselected so a first-time user sees the recommended choice; the other choices stay available.
initialPartitioningChoice: erase
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
defaultFileSystemType: "ext4"
# only filesystems whose mkfs is in the image (xfsprogs is not shipped; tests/calamares-jobs-test.sh checks each one)
availableFileSystemTypes: [ ext4, btrfs ]
# LUKS2 with cryptsetup's defaults (argon2id). Safe here because /boot is outside the container (see above).
luksGeneration: luks2
# Full-disk encryption is OFFERED in every automated choice (the "Encrypt system" box + passphrase fields exist) but is the
# user's choice: the box starts UNTICKED (owner's decision, 2026-09-17: "keep it optional for users to install and encrypt
# the disk with a passphrase"). Ticking it gives LUKS2 on / with the passphrase asked at every boot (Plymouth prompt).
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
# Tell the user that /boot stays unencrypted (honest; Ubuntu's own installer uses the same layout).
showNotEncryptedBootMessage: true
essentialMounts: [ "live-*", "control", "ventoy", "cdrom" ]
lvm:
    enable: false
partitionLayout:
    - name: "fabos-boot"
      filesystem: "ext4"
      noEncrypt: true
      mountPoint: "/boot"
      size: 2G
      minSize: 1G
    - name: "fabos-root"
      filesystem: "unknown"      # = the filesystem the user picks on the page (defaultFileSystemType: ext4)
      mountPoint: "/"
      size: 100%
      minSize: 12G
