# Fab OS installer (Calamares 3.3.14). Module configs live in modules/ (modules-search: local = /etc/calamares/modules/).
# Ubuntu's calamares package installs no default module configs, so EVERY exec module that reads one has a file here
# (mount, machineid and umount were added after an audit: without a file they ran with every option off - no bind
# mounts of /dev, /proc, /sys and efivarfs in the target, no machine-id). The whole exec sequence works offline;
# tests/calamares-jobs-test.sh replays it inside the image with the network disabled.
modules-search: [ local ]
instances:
  - id: efifallback
    module: shellprocess
    config: shellprocess-efifallback.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - packages
      - shellprocess
      - initramfscfg
      - initramfs
      - grubcfg
      - bootloader
      - shellprocess@efifallback
      - umount
  - show:
      - finished
branding: fabos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
