<svg xmlns="http://www.w3.org/2000/svg" width="232" height="100" viewBox="0 0 232 100"><desc>Fab OS window frame for the Aurorae v2 engine. The corner notches inside the window box are transparent on purpose: Aurorae paints this frame offset by the padding into the decoration rect, so anything drawn there shows as a square corner. No mask-* elements: in Aurorae they only set the blur region, never the window shape (brand/gen/aurorae_theme.py). The top-corner shadows are multiplied by a luminance mask (ids taper*/tp*) so they fade out along the notch edges instead of ending in a hard step.</desc><defs><style type="text/css" id="current-color-scheme">.ColorScheme-Text{color:#e6eaf0;}.ColorScheme-Background{color:#0f1420;}.ColorScheme-HeaderBackground{color:#0f1420;}.ColorScheme-Highlight{color:#6e9bff;}.ColorScheme-HighlightedText{color:#ffffff;}.ColorScheme-NegativeText{color:#ff6b6b;}</style><linearGradient id="shL" gradientUnits="userSpaceOnUse" x1="28" y1="0" x2="0" y2="0"><stop offset="0.0000" stop-color="#000" stop-opacity="0.380"/><stop offset="0.3500" stop-color="#000" stop-opacity="0.160"/><stop offset="0.7000" stop-color="#000" stop-opacity="0.046"/><stop offset="1.0000" stop-color="#000" stop-opacity="0.000"/></linearGradient><linearGradient id="shR" gradientUnits="userSpaceOnUse" x1="64" y1="0" x2="92" y2="0"><stop offset="0.0000" stop-color="#000" stop-opacity="0.380"/><stop offset="0.3500" stop-color="#000" stop-opacity="0.160"/><stop offset="0.7000" stop-color="#000" stop-opacity="0.046"/><stop offset="1.0000" stop-color="#000" stop-opacity="0.000"/></linearGradient><linearGradient id="shT" gradientUnits="userSpaceOnUse" x1="0" y1="28" x2="0" y2="0"><stop offset="0.0000" stop-color="#000" stop-opacity="0.380"/><stop offset="0.3500" stop-color="#000" stop-opacity="0.160"/><stop offset="0.7000" stop-color="#000" stop-opacity="0.046"/><stop offset="1.0000" stop-color="#000" stop-opacity="0.000"/></linearGradient><linearGradient id="shB" gradientUnits="user