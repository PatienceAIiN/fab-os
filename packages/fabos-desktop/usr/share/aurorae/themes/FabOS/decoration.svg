="42" height="42" fill="url(#tpTRi)"/></mask></defs><g transform="translate(0 0)"><g id="decoration-topleft"><path d="M0 0H42V28H28V42H0Z" fill="url(#shTL)" mask="url(#taperTL)"/><rect x="0" y="42" width="28" height="22" fill="url(#shL)"/><path d="M28 64 V42 A14 14 0 0 1 42 28 V64 Z" class="ColorScheme-HeaderBackground" style="fill:currentColor"/></g><g id="decoration-top"><rect x="42" y="0" width="8" height="28" fill="url(#shT)"/><rect x="42" y="28" width="8" height="36" class="ColorScheme-HeaderBackground" style="fill:currentColor"/></g><g id="decoration-topright"><path d="M50 0H92V42H64V28H50Z" fill="url(#shTR)" mask="url(#taperTR)"/><rect x="64" y="42" width="28" height="22" fill="url(#shR)"/><path d="M50 28 A14 14 0 0 1 64 42 V64 H50 Z" class="ColorScheme-HeaderBackground" style="fill:currentColor"/></g><g id="decoration-left"><rect x="0" y="64" width="42" height="8" style="fill:#000;fill-opacity:0"/><rect x="0" y="64" width="28" height="8" fill="url(#shL)"/></g><g id="decoration-center"><rect x="42" y="64" width="8" height="8" style="fill:#000;fill-opacity:0"/></g><g id="decoration-right"><rect x="50" y="64" width="42" height="8" style="fill:#000;fill-opacity:0"/><rect x="64" y="64" width="28" height="8" fill="url(#shR)"/></g><g id="decoration-bottomleft"><rect x="0" y="72" width="28" height="28" fill="url(#shBL)"/><rect x="28" y="72" width="14" height="28" fill="url(#shB)"/></g><g id="decoration-bottom"><rect x="42" y="72" width="8" height="28" fill="url(#shB)"/></g><g id="decoration-bottomright"><rect x="64" y="72" width="28" height="28" fill="url(#shBR)"/><rect x="50" y="72" width="14" height="28" fill="url(#shB)"/></g></g><g transform="translate(100 0)"><g id="decoration-inactive-topleft"><path d="M0 0H42V28H28V42H0Z" fill="url(#shTLi)" mask="url(#taperTLi)"/><rect x="0" y="42" width="28" height="22" fill="url(#shLi)"/><path d="M28 64 V42 A14 14 0 0 1 42 28 V64 Z" class="ColorScheme-HeaderBackground" style="fill:currentColor"/></g><g id="decoration-inactiv