<svg xmlns="http://www.w3.org/2000/svg" width="248" height="108" viewBox="0 0 248 108"><desc>Fab OS window frame for the Aurorae v2 engine. Flat: this frame paints no shadow (no gradients, no masks, no filters); the shadow of every window comes from the KDE-Rounded-Corners KWin effect alone (kwinrc [Round-Corners] UseNativeDecorationShadows=false). The 32 px padding and the corner notches inside the window box carry one uniform alpha-1/255 carrier fill (fill-opacity 0.004), because the effect shades only pixels whose alpha is not 0 and only inside the padding the decoration reserves (shapecorners_shadows.glsl: hasExpandedSize, tex.a == 0.0 returns tex). Aurorae paints this frame offset by the padding into the decoration, so the notch is shown as drawn. No mask-* elements: in Aurorae they only set the blur region, never the window shape (brand/gen/aurorae_theme.py).</desc><defs><style type="text/css" id="current-color-scheme">.ColorScheme-Text{color:#e6eaf0;}.ColorScheme-Background{color:#0f1420;}.ColorScheme-HeaderBackground{color:#0f1420;}.ColorScheme-Highlight{color:#6e9bff;}.ColorScheme-HighlightedText{color:#ffffff;}.ColorScheme-NegativeText{color:#ff6b6b;}</style></defs><g transform="translate(0 0)"><g id="decoration-topleft"><rect x="0" y="0" width="46" height="68" style="fill:#000;fill-opacity:0.004"/><path d="M32 68 V46 A14 14 0 0 1 46 32 V68 Z" class="ColorScheme-HeaderBackground" style="fill:currentColor"/></g><g id="decoration-top"><rect x="46" y="0" width="8" height="32" style="fill:#000;fill-opacity:0.004"/><rect x="46" y="32" width="8" height="36" class="ColorScheme-HeaderBackground" style="fill:currentColor"/></g><g id="decoration-topright"><rect x="54" y="0" width="46" height="68" style="fill:#000;fill-opacity:0.004"/><path d="M54 32 A14 14 0 0 1 68 46 V68 H54 Z" class="ColorScheme-HeaderBackground" style="fill:currentColor"/></g><g id="decoration-left"><rect x="0" y="68" width="46" height="8" style="fill:#000;fill-opacity:0"/><rect x="0" y="68" width="32" height="8" style="fill:#000;fill-opacity:0.004"/></g><g id="decoration-center"><rect x="46" y="68" width="8" height="8" style="fill:#000;fill-opacity:0"/></g><g id="decoration-right"><rect x="54" y="68" width="46" height="8" style="fill:#000;fill-opacity:0"/><rect x="68" y="68" width="32" height="8" style="fill:#000;fill-opacity:0.004"/></g><g id="decoration-bottomleft"><rect x="0" y="76" width="46" height="32" style="fill:#000;fill-opacity:0.004"/></g><g id="decoration-bottom"><rect x="46" y="76" width="8" height="32" style="fill:#000;fill-opacity:0.004"/></g><g id="decoration-bottomright"><rect x="54" y="76" width="46" height="32" style="fill:#000;fill-opacity:0.004"/></g></g><g transform="translate(108 0)"><g id="decoration-inactive-topleft"><rect x="0" y="0" width="46" height="68" style="fill:#000;fill-opacity:0.004"/><path d="M32 68 V46 A14 14 0 0 1 46 32 V68 Z" class="ColorScheme-HeaderBackground" style="fill:currentColor"/></g><g id="decoration-inactive-top"><rect x="46" y="0" width="8" height="32" style="fill:#000;fill-opacity:0.004"/><rect x="46" y="32" width="8" height="36" class="ColorScheme-HeaderBackground" style="fill:currentColor"/></g><g id="decoration-inactive-topright"><rect x="54" y="0" width="46" height="68" style="fill:#000;fill-opacity:0.004"/><path d="M54 32 A14 14 0 0 1 68 46 V68 H54 Z" class="ColorScheme-HeaderBackground" style="fill:currentColor"/></g><g id="decoration-inactive-left"><rect x="0" y="68" width="46" height="8" style="fill:#000;fill-opacity:0"/><rect x="0" y="68" width="32" height="8" style="fill:#000;fill-opacity:0.004"/></g><g id="decoration-inactive-center"><rect x="46" y="68" width="8" height="8" style="fill:#000;fill-opacity:0"/></g><g id="decoration-inactive-right"><rect x="54" y="68" width="46" height="8" style="fill:#000;fill-opacity:0"/><rect x="68" y="68" width="32" height="8" style="fill:#000;fill-opacity:0.004"/></g><g id="decoration-inactive-bottomleft"><rect x="0" y="76" width="46" height="32" style="fill:#000;fill-opacity:0.004"/></g><g id="decoration-inactive-bottom"><rect x="46" y="76" width="8" height="32" style="fill:#000;fill-opacity:0.004"/></g><g id="decoration-inactive-bottomright"><rect x="54" y="76" width="46" height="32" style="fill:#000;fill-opacity:0.004"/></g></g><g id="decoration-maximized-center"><rect x="216" y="0" width="8" height="8" class="ColorScheme-HeaderBackground" style="fill:currentColor"/></g><g id="decoration-maximized-inactive-center"><rect x="232" y="0" width="8" height="8" class="ColorScheme-HeaderBackground" style="fill:currentColor"/></g></svg>
