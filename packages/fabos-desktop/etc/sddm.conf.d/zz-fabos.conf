[Theme]
Current=fabos
CursorTheme=breeze_cursors
Font=@UI_FONT@,10

[General]
DisplayServer=wayland
# layer-shell: the greeter is a proper layer surface under kwin_wayland. Basic: the QtQuick.Controls style the theme's
# customised controls are written for (every Button/TextField/Popup in Main.qml sets its own background), so a style set
# by another package can never break the greeter again.
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QT_QUICK_CONTROLS_STYLE=Basic

[Wayland]
SessionDir=/usr/local/share/wayland-sessions
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
