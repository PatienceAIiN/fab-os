# @DISTRO_NAME@ kernel hardening (docs/ENTERPRISE.md, ADR-0017). Sorted after Ubuntu's 55-* files in /usr/lib/sysctl.d,
# so these values win where they overlap (kptr_restrict 1 -> 2, rp_filter 2 -> 1). Every key was checked against the
# image kernel's configuration (7.0.0-31-generic, /boot/config-*: SECURITY_YAMA, BPF_JIT, SYN_COOKIES, PRINTK, COREDUMP)
# and none of them touches anything Plasma, PipeWire, Flatpak or the agent's sandbox (bubblewrap, user namespaces) needs.
#
# Only a process's own descendants may be ptraced (Ubuntu default, restated so it is asserted): no debugger attaching to
# the agent, the browser or the voice daemon from another process of the same user.
kernel.yama.ptrace_scope = 1
# Kernel addresses are hidden from everyone, root included (Ubuntu ships 1 = hidden from non-root).
kernel.kptr_restrict = 2
# dmesg is for administrators (CAP_SYSLOG); kernel messages can carry addresses and hardware details.
kernel.dmesg_restrict = 1
# Symlink / hardlink / FIFO / regular-file protections in world- and group-writable sticky directories (/tmp): a user
# cannot trick another user's process into following their symlink or opening their FIFO/file there.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# A process that changed privileges (setuid, e.g. pkexec, sudo) never leaves a core dump.
fs.suid_dumpable = 0
# Strict reverse-path filtering: packets whose source could not have arrived on that interface are dropped.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# SYN cookies against SYN floods (the firewall denies incoming connections anyway; this covers what is allowed).
net.ipv4.tcp_syncookies = 1
# Harden the BPF JIT (constant blinding) for every user, root included; costs a little JIT time, nothing on the desktop.
net.core.bpf_jit_harden = 2
