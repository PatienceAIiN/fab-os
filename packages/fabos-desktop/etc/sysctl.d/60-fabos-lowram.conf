# @DISTRO_NAME@ low-RAM defaults (docs/LOW-RAM.md). Tuned for swap on zram (/etc/systemd/zram-generator.conf).
# Swapping into compressed RAM is cheap, so let the kernel do it freely instead of dropping file cache first.
vm.swappiness = 100
# Keep directory/inode caches around a little longer than the default (100): they are small and make
# Fab Files, Fab Search and application starts noticeably faster on slow laptop storage.
vm.vfs_cache_pressure = 50
# zram is random-access memory, not a disk: read one page at a time instead of 8 (default 3 = 2^3 pages).
vm.page-cluster = 0
