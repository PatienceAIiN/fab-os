# @DISTRO_NAME@ low-RAM defaults (docs/LOW-RAM.md). systemd-oomd keeps the desktop responsive by ending the
# largest offending process group before the kernel OOM killer freezes the machine. With swap on zram some memory
# pressure is normal, so the threshold is higher than the Ubuntu default (60% here, 50% for user sessions).
[OOM]
DefaultMemoryPressureLimit=70%
DefaultMemoryPressureDurationSec=20s
