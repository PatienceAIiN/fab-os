# @DISTRO_NAME@ low-RAM defaults (docs/LOW-RAM.md): compressed swap in RAM so a 2 GB machine stays responsive.
# This file wins over /usr/lib/systemd/zram-generator.conf (the first file found in /etc, /run, /usr/lib is used).
# systemd-zram-generator creates dev-zram0.swap at boot from this; there is no service to enable.
# To turn zram off: remove the [zram0] section (or boot with systemd.zram=0). See zram-generator.conf(5).
[zram0]
# half of RAM, capped at 4 GiB: 1 GiB on a 2 GB laptop, 2 GiB on 4 GB, 4 GiB from 8 GB up
zram-size = min(ram / 2, 4096)
# zstd: ~3:1 on typical desktop memory, low CPU cost on any x86-64 (kernel built-in on Ubuntu)
compression-algorithm = zstd
# preferred over any disk swap partition the installer or the user adds
swap-priority = 100
