# @DISTRO_NAME@ low-RAM defaults (docs/LOW-RAM.md). systemd-oomd ships user@.service.d/10-oomd-user-service-defaults.conf
# with ManagedOOMMemoryPressureLimit=50%; a per-unit value overrides oomd.conf, so the desktop-session limit is
# raised here too (90- sorts after the 10- default, so this file wins). Same 70% / 20 s as /etc/systemd/oomd.conf.d/fabos.conf.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=70%
