# @DISTRO_NAME@ (docs/PERFORMANCE.md): a user service that ignores SIGTERM holds up logout and shutdown for 90 s with the
# stock default ("A stop job is running for ..."). 15 s is ample for every Plasma and @DISTRO_NAME@ user unit to save its
# state; after that the manager kills it and the session ends. Read back: systemctl --user show -p DefaultTimeoutStopUSec
[Manager]
DefaultTimeoutStopSec=15s
