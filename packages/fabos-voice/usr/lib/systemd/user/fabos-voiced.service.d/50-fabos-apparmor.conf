# @DISTRO_NAME@ security drop-in (ADR-0017): run the daemon script directly instead of `python3 <script>` so the AppArmor
# profile fabos-voiced (/etc/apparmor.d/fabos-voiced, enforce mode) attaches at exec — a profile attaches to the path of the
# file being executed, and a script executed through its shebang keeps its own path as that file. Same interpreter, same
# arguments, same environment as the unit's original ExecStart.
[Service]
ExecStart=
ExecStart=/usr/lib/fabos/voice/fabos_voiced.py
