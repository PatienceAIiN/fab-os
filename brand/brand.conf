# FabOS OS — single source of truth for identity. Shell-sourceable, also parsed by Python.
# Change a name here and every package, splash, theme and doc picks it up on the next build.
DISTRO_NAME="Fab OS"
DISTRO_ID="fabos"
DISTRO_ID_LIKE="ubuntu debian"
DISTRO_VERSION="1.0"
DISTRO_VERSION_ID="1.0"
# Debian revision of every fabos-* package for this DISTRO_VERSION (control: Version: @DISTRO_VERSION@-@PKG_REVISION@).
# Bump it when the packages change without a new OS version so apt sees an upgrade.
PKG_REVISION="7"
DISTRO_CODENAME="loom"
DISTRO_PRETTY_NAME="Fab OS 1.0 (Loom)"
VENDOR_NAME="Patience AI"
VENDOR_SHORT="patienceai"
HOME_URL="https://fabos.patienceai.in/"
SUPPORT_URL="https://fabos.patienceai.in/docs/"
BUG_REPORT_URL="https://github.com/PatienceAIiN/fab-os/issues"
PRIVACY_POLICY_URL="https://fabos.patienceai.in/docs/"
DOCS_URL="https://fabos.patienceai.in/docs/"
LOGO_ICON_NAME="fabos"
# Ubuntu base we derive from. Kept so apt/PPA tooling that keys on the Ubuntu codename keeps working.
BASE_ID="ubuntu"
BASE_VERSION_ID="26.04"
BASE_CODENAME="resolute"
# Colours (from the Lumen design tokens, kept for continuity)
ACCENT="#3B6EF5"
ACCENT_DARK="#6E9BFF"
BG_DARK="#0E1116"
BG_LIGHT="#F6F7F9"
INK="#16171A"
UI_FONT="Inter"
MONO_FONT="JetBrains Mono"
