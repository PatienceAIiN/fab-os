<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Fabric OS loading">
  <!-- Original Fabric OS animated mark. Apache-2.0 / CC0 for the artwork. -->
  <g transform="rotate(-24 32 32)">
    <circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="94 32">
      <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <rect x="23" y="25" width="4" height="14" rx="2" fill="currentColor">
      <animate attributeName="height" values="14;20;14" dur="1.2s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="25;22;25" dur="1.2s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="22" width="4" height="20" rx="2" fill="currentColor">
      <animate attributeName="height" values="20;14;20" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="22;25;22" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="37" y="25" width="4" height="14" rx="2" fill="currentColor">
      <animate attributeName="height" values="14;20;14" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="25;22;25" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
