<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Fab OS AI mark (static frame)</title>
  <!-- Original Patience AI artwork, Apache-2.0 / CC0. Static frame of the animated QML mark on the ask bar
       (packages/fabos-agent/.../askbar/contents/ui/AiMark.qml): breathing glow, orb with highlight, ring of three
       short arcs that orbit. Colour follows the accent (#3B6EF5); use currentColor to recolour. -->
