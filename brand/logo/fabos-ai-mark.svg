    <g stroke="#3B6EF5" stroke-width="4" stroke-linecap="round" transform="rotate(-18 32 32)">
      <path d="M 32 6 A 26 26 0 0 1 54.9 18.8"/>
      <path d="M 54.9 45.2 A 26 26 0 0 1 32 58" transform="rotate(-8 32 32)"/>
      <path d="M 9.1 45.2 A 26 26 0 0 1 9.1 18.8" transform="rotate(8 32 32)"/>
    </g>
    <circle cx="32" cy="32" r="16" fill="#3B6EF5"/>
    <circle cx="27" cy="26.5" r="6.5" fill="#FFFFFF" fill-opacity="0.38"/>
  </g>
