<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- A private session bus for tests/logout-screen-test.sh that activates nothing: no <servicedir>, so addressing
     org.kde.LogoutPrompt cannot start a second greeter from /usr/share/dbus-1/services and nothing pulls in
     xdg-desktop-portal. Same open policy as the stock session.conf (own any name, dbus-monitor may become a monitor). -->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
