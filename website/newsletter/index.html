<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fab OS newsletter — Patience AI</title>
<meta name="description" content="Manage Fab OS newsletter preferences.">
<link rel="icon" href="../fabos.svg">
<style>
:root{--deep:#321344;--plum:#7e3f95;--ink:#49205d;--muted:#806587;--line:#ead7e7;--shadow:0 18px 55px rgba(91,43,112,.13)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f6d9e8,#fff9f7 58%,#efe1f4);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}.wrap{width:min(900px,100% - 36px);margin:auto}.topbar{padding:22px 0}.nav{display:flex;align-items:center;gap:2px}.brand{display:flex;align-items:center;gap:1px;text-decoration:none;font:bold 22px/1 Helvetica,Arial,sans-serif;color:var(--deep);letter-spacing:-.04em}.brand img{width:38px;height:38px;mix-blend-mode:multiply}.spacer{flex:1}.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 17px;border:1px solid var(--plum);border-radius:999px;color:var(--plum);font-weight:800;text-decoration:none;background:rgba(255,255,255,.35)}main{padding:70px 0}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8a4a98}.hero h1{margin:12px 0;color:var(--deep);font:800 clamp(42px,7vw,76px)/.98 Helvetica,Arial,sans-serif;letter-spacing:-.06em}.hero p{max-width:620px;color:var(--muted);font-size:18px}.card{margin-top:30px;padding:30px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.72);box-shadow:var(--shadow)}.card h2{margin:0 0 14px;font:800 28px/1.1 Helvetica,Arial,sans-serif;color:var(--deep)}.checks{display:grid;gap:12px;margin:18px 0;color:var(--muted)}.checks label{display:flex;gap:10px;align-items:center}.checks input{accent-color:var(--plum)}.button.primary{border:0;background:var(--plum);color:#fff;cursor:pointer}.message{min-height:25px;color:var(--plum);font-size:14px}.footer{padding:10px 0 54px;color:var(--muted);font-size:12px}.footer a{color:var(--plum);font-weight:800;text-decoration:none}@media(max-width:560px){.wrap{width:min(100% - 28px,900px)}.topbar{padding:15px 0}.brand{font-size:19px}.brand img{width:34px;height:34px}.nav .button{font-size:12px;padding:9px 13px}.nav .spacer{display:none}.nav{justify-content:space-between}main{padding:42px 0}.card{padding:20px;border-radius:19px}}
</style>
</head>
<body><header class="topbar"><div class="wrap nav"><a class="brand" href="../"><img src="../fabos.svg" alt="">Fab OS</a><span class="spacer"></span><a class="button" href="../">Back to Fab OS</a></div></header>
<main class="wrap"><section class="hero"><span class="eyebrow">Newsletter</span><h1>Stay close to the work.</h1><p>Choose the Fab OS notes you want to receive. Your preferences can be changed here at any time.</p></section><section class="card" id="manage-card"><h2>Manage your subscription</h2><p id="account-note">Loading your subscription…</p><form id="manage-form"><div class="checks"><label><input type="checkbox" name="community"> Community messages</label><label><input type="checkbox" name="updates"> Software updates</label><label><input type="checkbox" name="product"> Product news</label></div><button class="button primary" type="submit">Save preferences</button> <button class="button" type="button" id="unsubscribe">Opt out</button><p class="message" id="message" role="status"></p></form></section></main><footer class="footer wrap">Fab OS by Patience AI · Copyright 2026 Patience AI. All rights reserved. · <a href="../changelog/">Changelog</a></footer>
<script>
const params=new URLSearchParams(location.search),manageToken=params.get('token')||'',form=document.getElementById('manage-form'),note=document.getElementById('account-note'),message=document.getElementById('message');
async function request(options={}){const response=await fetch('/api/newsletter/manage'+(options.method==='GET'?`?token=${encodeURIComponent(manageToken)}`:''),{headers:{'content-type':'application/json'},...options});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'This link is not available.');return data}
async function load(){if(!manageToken){note.textContent='Use the manage link from your Fab OS welcome email to change preferences.';form.hidden=true;return}try{const data=await request({method:'GET'});note.textContent=`Subscription for ${data.email} · ${data.status}`;form.community.checked=data.community;form.updates.checked=data.updates;form.product.checked=data.product;if(params.get('action')==='unsubscribe')await update('unsubscribe')}catch(error){note.textContent=error.message;form.hidden=true}}
async function update(action){const body={token:manageToken,action};if(action!=='unsubscribe'){body.community=form.community.checked;body.updates=form.updates.checked;body.product=form.product.checked}const data=await request({method:'POST',body:JSON.stringify(body)});message.textContent=action==='unsubscribe'?'You have opted out of the newsletter.':'Your preferences are saved.';return data}
form.addEventListener('submit',async event=>{event.preventDefault();try{await update('save')}catch(error){message.textContent=error.message}});document.getElementById('unsubscribe').addEventListener('click',async()=>{if(!confirm('Opt out of Fab OS newsletter emails?'))return;try{await update('unsubscribe')}catch(error){message.textContent=error.message}});load();
</script></body></html>
