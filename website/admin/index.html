<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Fab OS admin — Patience AI</title><link rel="icon" href="../fabos.svg">
<style>
:root{--deep:#321344;--plum:#7e3f95;--ink:#49205d;--muted:#806587;--line:#ead7e7;--danger:#a43e5b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f6d9e8,#fff9f7 58%,#efe1f4);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}.wrap{width:min(1180px,100% - 36px);margin:auto}.topbar{padding:22px 0}.nav{display:flex;align-items:center;gap:2px}.brand{display:flex;align-items:center;gap:1px;text-decoration:none;font:bold 22px/1 Helvetica,Arial,sans-serif;color:var(--deep);letter-spacing:-.04em}.brand img{width:38px;height:38px;mix-blend-mode:multiply}.spacer{flex:1}.button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 16px;border:1px solid var(--plum);border-radius:999px;color:var(--plum);font-weight:800;background:#fff5fb;cursor:pointer}.primary{border:0;background:var(--plum);color:#fff}.danger{border-color:var(--danger);color:var(--danger)}main{padding:44px 0 70px}.hero h1{margin:10px 0;color:var(--deep);font:800 clamp(38px,6vw,68px)/.98 Helvetica,Arial,sans-serif;letter-spacing:-.06em}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8a4a98}.card{margin-top:20px;padding:24px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.78);box-shadow:0 18px 55px rgba(91,43,112,.12)}.login{max-width:420px}.field{display:grid;gap:6px;margin:12px 0}.field input,.field textarea,.field select{width:100%;border:1px solid #dbc5df;border-radius:13px;padding:12px;background:#fff;color:var(--ink);font:inherit}.field textarea{min-height:110px;resize:vertical}.message{min-height:22px;color:var(--danger)}.dashboard{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.stat{padding:20px;border-radius:18px;background:#f7e9f3}.stat b{display:block;font:800 34px Helvetica;color:var(--deep)}.section-title{margin:34px 0 12px;font:800 28px Helvetica;color:var(--deep)}.list{display:grid;gap:12px}.item{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}.item-head{display:flex;align-items:center;gap:10px;justify-content:space-between}.item h3{margin:0;color:var(--deep);font:800 19px Helvetica}.item small,.muted{color:var(--muted)}.item p{white-space:pre-wrap;margin:8px 0}.item .item{margin-top:10px;background:#fff8fc}.release-form{display:grid;grid-template-columns:150px 1fr 150px;gap:10px;align-items:start}.release-form textarea{grid-column:1/-1;min-height:110px;width:100%;border:1px solid #dbc5df;border-radius:13px;padding:12px;background:#fff;color:var(--ink);font:inherit}.empty{padding:20px;border:1px dashed #d8bfdf;border-radius:15px;color:var(--muted)}.footer{padding:10px 0 45px;color:var(--muted);font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.release-form{grid-template-columns:1fr}.release-form textarea{grid-column:auto}}@media(max-width:560px){.wrap{width:min(100% - 28px,1180px)}.topbar{padding:15px 0}.brand{font-size:19px}.brand img{width:34px;height:34px}.nav .button{font-size:12px;padding:9px 13px}main{padding-top:30px}.card{padding:17px;border-radius:18px}}
</style>
</head>
<body><header class="topbar"><div class="wrap nav"><a class="brand" href="../"><img src="../fabos.svg" alt="">Fab OS admin</a><span class="spacer"></span><button class="button" id="logout" hidden>Log out</button></div></header>
<main class="wrap"><section class="hero"><span class="eyebrow">Private operations</span><h1>Admin console.</h1></section><section class="card login" id="login-card"><h2>Sign in</h2><form id="login-form"><label class="field">Username<input id="username" autocomplete="username" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label><button class="button primary" type="submit">Sign in</button><p class="message" id="login-message"></p></form></section><section class="dashboard" id="dashboard"><div class="grid"><div class="stat"><span class="muted">Subscribers</span><b id="subscriber-count">0</b></div><div class="stat"><span class="muted">Community posts</span><b id="post-count">0</b></div><div class="stat"><span class="muted">Reports</span><b id="report-count">0</b></div></div><h2 class="section-title">Release notes</h2><form class="card release-form" id="release-form"><input name="version" placeholder="Version" required><input name="title" placeholder="Release title" required><select name="status"><option value="draft">Draft</option><option value="published">Published</option><option value="archived">Archived</option></select><textarea name="body" placeholder="Changelog notes" required></textarea><button class="button primary" type="submit">Add release note</button></form><div class="list" id="releases"></div><h2 class="section-title">Newsletter subscribers</h2><div class="list" id="subscribers"></div><h2 class="section-title">Community posts and chats</h2><div class="list" id="posts"></div><h2 class="section-title">Reports</h2><div class="list" id="reports"></div></section></main><footer class="footer wrap">Fab OS by Patience AI · Private admin area.</footer>
<script>
const loginCard=document.getElementById('login-card'),dashboard=document.getElementById('dashboard'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const response=await fetch('/api/admin'+path,{headers:{'content-type':'application/json',...(options.headers||{})},...options});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Request failed.');return data}
function button(label,action,id){return `<button class="button danger" data-action="${action}" data-id="${id}">${label}</button>`}
function render(data){document.getElementById('subscriber-count').textContent=data.subscribers.length;document.getElementById('post-count').textContent=data.posts.length;document.getElementById('report-count').textContent=data.reports.length;document.getElementById('subscribers').innerHTML=data.subscribers.length?data.subscribers.map(s=>`<article class="item"><div class="item-head"><h3>${esc(s.email)}</h3>${button('Delete','subscriber',s.id)}</div><small>${esc(s.status)} · ${esc(s.created_at)}</small></article>`).join(''):'<div class="empty">No subscribers yet.</div>';document.getElementById('posts').innerHTML=data.posts.length?data.posts.map(p=>`<article class="item"><div class="item-head"><h3>${esc(p.displayName)}</h3>${button('Delete post','post',p.id)}</div><small>${esc(p.createdAt)}${p.email?` · ${esc(p.email)}`:''}</small><p>${esc(p.body||'[image post]')}</p>${p.comments.map(c=>`<div class="item"><b>${esc(c.displayName)}</b> · <small>${esc(c.createdAt)}</small><p>${esc(c.body)}</p>${button('Delete reply','comment',c.id)}</div>`).join('')}</article>`).join(''):'<div class="empty">No community posts.</div>';document.getElementById('reports').innerHTML=data.reports.length?data.reports.map(r=>`<article class="item"><b>Post #${r.post_id}</b><p>${esc(r.reason)}</p><small>${esc(r.created_at)}</small></article>`).join(''):'<div class="empty">No reports.</div>';document.getElementById('releases').innerHTML=data.releases.length?data.releases.map(r=>`<article class="item"><div class="item-head"><h3>${esc(r.version)} · ${esc(r.title)}</h3>${button('Delete','release',r.id)}</div><small>${esc(r.status)}</small><p>${esc(r.body)}</p></article>`).join(''):'<div class="empty">No release notes yet.</div>'}
async function load(){try{const data=await api('/overview');loginCard.style.display='none';dashboard.style.display='block';document.getElementById('logout').hidden=false;render(data)}catch(error){if(error.message.includes('authentication')){loginCard.style.display='block';dashboard.style.display='none'}else document.getElementById('login-message').textContent=error.message}}
document.getElementById('login-form').addEventListener('submit',async event=>{event.preventDefault();const message=document.getElementById('login-message');try{await api('/login',{method:'POST',body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});message.textContent='';await load()}catch(error){message.textContent=error.message}});
document.getElementById('logout').onclick=async()=>{await api('/logout',{method:'POST'});location.reload()};
document.getElementById('release-form').addEventListener('submit',async event=>{event.preventDefault();const body=Object.fromEntries(new FormData(event.currentTarget));try{await api('/releases',{method:'POST',body:JSON.stringify(body)});event.currentTarget.reset();await load()}catch(error){alert(error.message)}});
dashboard.addEventListener('click',async event=>{const target=event.target.closest('[data-action]');if(!target)return;if(!confirm('Delete this item?'))return;const routes={subscriber:`/subscribers/${target.dataset.id}`,post:`/community/posts/${target.dataset.id}`,comment:`/community/comments/${target.dataset.id}`,release:`/releases/${target.dataset.id}`};try{await api(routes[target.dataset.action],{method:'DELETE'});await load()}catch(error){alert(error.message)}});load();
</script></body></html>
