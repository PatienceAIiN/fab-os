<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fab OS community — Patience AI</title>
<meta name="description" content="A calm, public community for Fab OS discussions, images, and updates.">
<link rel="icon" href="../fabos.svg">
<style>
:root{--deep:#321344;--plum:#7e3f95;--pink:#f8d9e8;--cream:#fff9f7;--ink:#49205d;--muted:#806587;--line:#ead7e7;--shadow:0 18px 55px rgba(91,43,112,.13)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f6d9e8,#fff9f7 58%,#efe1f4);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}a{color:inherit}.wrap{width:min(1080px,100% - 36px);margin:auto}.topbar{padding:22px 0}.nav{display:flex;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:1px;text-decoration:none;font:bold 22px/1 Helvetica,Arial,sans-serif;color:var(--deep);letter-spacing:-.04em}.brand img{width:38px;height:38px;mix-blend-mode:multiply}.spacer{flex:1}.button,.button:visited{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 17px;border:1px solid var(--plum);border-radius:999px;color:var(--plum);font-weight:800;text-decoration:none;background:rgba(255,255,255,.35);cursor:pointer}.button.primary{background:var(--plum);color:#fff}.hero{padding:52px 0 34px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8a4a98}.hero h1{max-width:740px;margin:10px 0;color:var(--deep);font:800 clamp(40px,7vw,78px)/.98 Helvetica,Arial,sans-serif;letter-spacing:-.06em}.hero p{max-width:680px;margin:18px 0 0;color:var(--muted);font-size:17px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;align-items:start}.composer,.post,.side-card{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.composer{padding:22px;margin-bottom:20px}.composer h2,.side-card h2{margin:0 0 12px;font:800 25px/1.1 Helvetica,Arial,sans-serif;color:var(--deep)}textarea,input{width:100%;border:1px solid #dfcde2;border-radius:15px;padding:13px 14px;background:#fff;color:var(--ink);font:inherit;outline:none}textarea{min-height:110px;resize:vertical}input:focus,textarea:focus{border-color:var(--plum);box-shadow:0 0 0 3px rgba(126,63,149,.12)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.composer-actions{display:flex;align-items:center;gap:10px;margin-top:12px}.file-label{display:inline-flex;align-items:center;gap:8px;color:var(--plum);font-weight:800;cursor:pointer}.file-label input{display:none}.preview{display:none;max-width:100%;max-height:240px;margin-top:12px;border-radius:15px}.privacy-note{margin:12px 0 0;color:var(--muted);font-size:12px}.feed{display:grid;gap:16px}.post{padding:21px}.post-head,.post-foot{display:flex;align-items:center;gap:10px}.post-head{margin-bottom:12px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#e2b5d5,#d9c4ed);color:var(--deep);font-weight:900}.post-meta{display:grid;line-height:1.15}.post-meta strong{color:var(--deep)}.post-meta small,.post-foot{color:var(--muted);font-size:12px}.post-body{white-space:pre-wrap;overflow-wrap:anywhere}.post-image{display:block;width:100%;max-height:460px;object-fit:cover;border-radius:17px;margin-top:14px;cursor:zoom-in}.reshare{display:inline-flex;margin-left:auto;padding:4px 9px;border-radius:999px;background:#f1e3f3;color:var(--plum);font-size:11px;font-weight:800}.post-foot{margin-top:16px;justify-content:space-between;flex-wrap:wrap}.post-actions{display:flex;gap:8px;flex-wrap:wrap}.post-actions button{border:0;background:transparent;color:var(--plum);font:700 13px Inter;cursor:pointer;padding:5px 4px}.comments{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:grid;gap:8px}.comment{padding:10px 12px;border-radius:13px;background:#fff6fb}.comment b{color:var(--deep)}.comment-form{display:flex;gap:7px;margin-top:10px}.comment-form input{min-width:0}.side-card{padding:20px;position:sticky;top:18px}.side-card p,.side-card li{color:var(--muted);font-size:13px}.side-card ul{padding-left:19px}.status{padding:10px 12px;border-radius:13px;background:#f5e6f4;color:var(--plum);font-size:12px;margin-bottom:14px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #d8bfdf;border-radius:18px}.footer{padding:46px 0 54px;color:var(--muted);font-size:12px}.footer a{margin-right:15px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:12px 16px;border-radius:999px;background:var(--deep);color:#fff;box-shadow:var(--shadow);display:none;z-index:5}.lightbox{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:rgba(25,10,34,.84)}.lightbox.open{display:grid}.lightbox img{max-width:min(1100px,96vw);max-height:90vh;object-fit:contain;border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.3)}.lightbox-close{position:absolute;top:18px;right:20px;width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:var(--deep);font-size:26px;cursor:pointer}@media(max-width:800px){.layout{grid-template-columns:1fr}.side-card{position:static}.hero{padding-top:34px}}@media(max-width:560px){.wrap{width:min(100% - 28px,1080px)}.topbar{padding:15px 0}.nav .button{min-height:42px;padding:9px 13px;font-size:12px}.brand{font-size:19px}.brand img{width:34px;height:34px}.hero{padding:34px 0 24px}.hero h1{font-size:clamp(39px,12vw,58px)}.hero p{font-size:15px}.composer,.post,.side-card{border-radius:19px;padding:17px}.form-row{grid-template-columns:1fr}.composer-actions{align-items:stretch;flex-direction:column}.composer-actions .button{width:100%}.comment-form{display:grid;grid-template-columns:1fr}.comment-form .button{width:100%}}
/* Community action controls stay icon-only while remaining accessible through labels. */
.post-actions button{border:0;background:transparent;color:var(--plum);cursor:pointer;padding:7px;border-radius:50%;display:grid;place-items:center;width:34px;height:34px}
.post-actions button:hover,.post-actions button:focus-visible{background:#f1e3f3;outline:2px solid #c78bd2;outline-offset:2px}
.post-actions svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.footer{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}.footer .legal{width:100%;color:var(--muted)}
.layout{display:block}
</style>
</head>
<body>
<header class="topbar"><div class="wrap nav"><a class="brand" href="../"><img src="../fabos.svg" alt="">Fab OS</a><span class="spacer"></span><a class="button" href="../">Back to Fab OS</a></div></header>
<main class="wrap">
<section class="hero"><span class="eyebrow">Fab OS community</span><h1>A thoughtful place to share.</h1><p>Join the public conversation around Fab OS.</p></section>
<div class="layout"><section>
<div class="composer"><h2>Start a post</h2><textarea id="post-body" maxlength="5000" placeholder="Share an idea, question, image, or update…"></textarea><div class="form-row"><input id="post-name" maxlength="60" placeholder="Name (optional)"><input id="post-email" type="email" maxlength="160" placeholder="Email for replies (optional)"></div><img id="preview" class="preview" alt="Selected image preview"><div class="composer-actions"><label class="file-label">＋ Add image<input id="post-image" type="file" accept="image/png,image/jpeg,image/webp"></label><span class="spacer"></span><button class="button primary" id="post-submit">Publish post</button></div></div>
<div id="feed" class="feed"><div class="empty">Loading the community…</div></div>
</section></div>
</main><footer class="footer wrap"><a href="../">Fab OS</a><a href="../docs/">Documentation</a><a href="../updates/">Updates</a><a href="guidelines/">Guidelines</a><a href="mailto:info@patienceai.in">Contact</a><span class="legal">Fab OS by Patience AI · Copyright 2026 Patience AI. All rights reserved.</span>
</footer><div id="toast" class="toast"></div><div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Expanded community image"><button class="lightbox-close" id="lightbox-close" aria-label="Close image">×</button><img id="lightbox-image" alt="Expanded community image"></div>
<script>
const feed=document.getElementById('feed'),toast=document.getElementById('toast'),visitorKey='fabos-community-visitor';const visitorId=localStorage.getItem(visitorKey)||crypto.randomUUID();localStorage.setItem(visitorKey,visitorId);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const when=s=>new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date(s));const show=s=>{toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',2800)};
async function api(path,options={}){const r=await fetch('/api/community'+path,{headers:{'content-type':'application/json',...(options.headers||{})},...options});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Something went wrong.');return data}
const icons={like:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v10H4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h3Zm0 10h9.2a2 2 0 0 0 1.9-1.4l2.2-6.5A1.6 1.6 0 0 0 18.8 10H14l.7-4.2A2.4 2.4 0 0 0 12.3 3L7 10v10Z"/></svg>',reshare:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 3 4 4-4 4M21 7H8a5 5 0 0 0-5 5m4 9-4-4 4-4M3 17h13a5 5 0 0 0 5-5"/></svg>',report:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4m0 0c5-3 9 3 14 0v10c-5 3-9-3-14 0"/></svg>',edit:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16-.8 4.8L8 20l11-11a2.8 2.8 0 0 0-4-4L4 16Z"/><path d="m13.5 6.5 4 4"/></svg>',delete:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16m-10 4v6m4-6v6M9 7V4h6v3m-9 0 1 14h8l1-14"/></svg>'};
function actionButton(action,label){return `<button type="button" data-action="${action}" aria-label="${label}" title="${label}">${icons[action]}</button>`}
function renderPost(p){const saved=localStorage.getItem('fabos-owner-'+p.id);return `<article class="post" data-id="${p.id}"><div class="post-head"><span class="avatar">${esc((p.displayName||'A')[0].toUpperCase())}</span><span class="post-meta"><strong>${esc(p.displayName)}</strong><small>${esc(when(p.createdAt))}</small></span>${p.resharedPostId?`<span class="reshare">Reshared by ${esc(p.resharedBy||p.displayName)}</span>`:''}</div>${p.body?`<div class="post-body">${esc(p.body)}</div>`:''}${p.imageUrl?`<img class="post-image" loading="lazy" src="${esc(p.imageUrl)}" alt="Community image">`:''}<div class="post-foot"><span>${p.likeCount||0} likes · ${p.comments?.length||0} comments</span><span class="post-actions">${actionButton('like','Like')}${actionButton('reshare','Reshare')}${actionButton('report','Report')}${saved?actionButton('edit','Edit')+actionButton('delete','Delete'):''}</span></div><div class="comments">${(p.comments||[]).map(c=>`<div class="comment"><b>${esc(c.displayName)}</b> · <small>${esc(when(c.createdAt))}</small><br>${esc(c.body)}</div>`).join('')}<div class="comment-form"><input data-comment placeholder="Write a comment…" maxlength="1200"><button class="button" data-action="comment">Reply</button></div></div></article>`}
async function load(){try{const data=await api('/posts');feed.innerHTML=data.posts.length?data.posts.map(renderPost).join(''):'<div class="empty">No posts yet. Start the conversation.</div>'}catch(e){feed.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function compress(file){const image=new Image();image.src=URL.createObjectURL(file);await image.decode();const scale=Math.min(1,1400/Math.max(image.naturalWidth,image.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.round(image.naturalWidth*scale);canvas.height=Math.round(image.naturalHeight*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/webp',.78)}
let imageData='';document.getElementById('post-image').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{imageData=await compress(file);const preview=document.getElementById('preview');preview.src=imageData;preview.style.display='block'}catch{show('Could not compress that image.')}};
document.getElementById('post-submit').onclick=async()=>{const button=document.getElementById('post-submit');button.disabled=true;try{const data=await api('/posts',{method:'POST',body:JSON.stringify({body:document.getElementById('post-body').value,displayName:document.getElementById('post-name').value,email:document.getElementById('post-email').value,imageData})});localStorage.setItem('fabos-owner-'+data.post.id,data.ownerToken);document.getElementById('post-body').value='';document.getElementById('post-name').value='';document.getElementById('post-email').value='';imageData='';document.getElementById('preview').style.display='none';show('Your post is live.');load()}catch(e){show(e.message)}finally{button.disabled=false}};
feed.onclick=async e=>{const button=e.target.closest('[data-action]');if(!button)return;const post=button.closest('.post'),id=post.dataset.id;try{if(button.dataset.action==='like'){await api(`/posts/${id}/react`,{method:'POST',body:JSON.stringify({kind:'like',visitorId})});show('Like recorded.');load()}else if(button.dataset.action==='reshare'){const name=prompt('Name shown on the reshare (optional):')||'Anonymous';const data=await api(`/posts/${id}/reshare`,{method:'POST',body:JSON.stringify({displayName:name})});localStorage.setItem('fabos-owner-'+data.post.id,data.ownerToken);show('Reshared.');load()}else if(button.dataset.action==='report'){const reason=prompt('Why are you reporting this post?');if(reason){await api(`/posts/${id}/report`,{method:'POST',body:JSON.stringify({reason})});show('Report sent for review.')}}else if(button.dataset.action==='edit'){const next=prompt('Update your post:',post.querySelector('.post-body')?.textContent||'');if(next!==null){await fetch(`/api/community/posts/${id}`,{method:'PATCH',headers:{'content-type':'application/json','x-owner-token':localStorage.getItem('fabos-owner-'+id)},body:JSON.stringify({body:next})});show('Post updated.');load()}}else if(button.dataset.action==='delete'){if(confirm('Delete this post?')){await fetch(`/api/community/posts/${id}`,{method:'DELETE',headers:{'x-owner-token':localStorage.getItem('fabos-owner-'+id)}});localStorage.removeItem('fabos-owner-'+id);show('Post deleted.');load()}}else if(button.dataset.action==='comment'){const input=post.querySelector('[data-comment]');if(!input.value.trim())return;await api(`/posts/${id}/comments`,{method:'POST',body:JSON.stringify({body:input.value,displayName:'Anonymous'})});input.value='';show('Reply posted.');load()}}catch(err){show(err.message)}};
const lightbox=document.getElementById("lightbox"),lightboxImage=document.getElementById("lightbox-image");feed.addEventListener("click",e=>{const image=e.target.closest(".post-image");if(!image)return;lightboxImage.src=image.src;lightbox.classList.add("open")});document.getElementById("lightbox-close").onclick=()=>lightbox.classList.remove("open");lightbox.onclick=e=>{if(e.target===lightbox)lightbox.classList.remove("open")};document.addEventListener("keydown",e=>{if(e.key==="Escape")lightbox.classList.remove("open")});load();
</script></body></html>
